name: Collect forecast and actuals

on:
  schedule:
    # 12:00 UTC daily (~8am US Eastern), after the morning CWF issuance
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect forecast
        run: python scripts/collect_forecast.py

      - name: Collect actuals
        run: python scripts/collect_actuals.py

      - name: Commit new data
        run: |
          git config user.name "Steve"
          git config user.email "325648081+skofoed-1@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily forecast + actuals pull $(date -u +%Y-%m-%d)"
          git push
